# 서버 포트
server.port=8081

# ===========================================
# 설정 변수 (여기서 값을 수정하세요)
# ===========================================
app.server.port=8081
app.db.host=localhost
app.db.port=5432
app.db.name=qcheck
app.db.username=postgres
app.db.password=test

# JWT 설정
jwt.secret=qcheck-secret-key-for-jwt-token-signing-with-minimum-256-bits-length-required
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# ===========================================
# 서버 설정
# ===========================================
server.port=${app.server.port}

# ===========================================

# DB 연결 (PostgreSQL)
+  # ===========================================
spring.datasource.url=jdbc:postgresql://${app.db.host}:${app.db.port}/${app.db.name}
spring.datasource.username=${app.db.username}
spring.datasource.password=${app.db.password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA 옵션
# ===========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Spring Security 설정
# ===========================================
spring.security.user.password=
spring.security.filter.order=5

# CORS 설정
# ===========================================
cors.allowed-origins=http://localhost:4200
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true
cors.max-age=3600

# 파일 업로드 설정
# ===========================================
file.upload-dir=/files/defects
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
