<div class="register-container">
  <div class="register-card">
    <div class="logo-section">
      <h1 class="logo">QCheck</h1>
      <p class="subtitle">회원가입</p>
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="register-form">

      <div class="form-group">
        <label class="form-label">회사명 <span class="required">*</span></label>
        <input type="text" formControlName="companyNm" class="form-input"
          [class.error]="companyNm?.invalid && companyNm?.touched"
          placeholder="회사명을 입력하세요" />
        <div class="error-message" *ngIf="companyNm?.invalid && companyNm?.touched">
          {{ getError('companyNm') }}
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">사원 ID <span class="required">*</span></label>
          <input type="text" formControlName="empId" class="form-input"
            [class.error]="empId?.invalid && empId?.touched"
            placeholder="로그인 ID" />
          <div class="error-message" *ngIf="empId?.invalid && empId?.touched">
            {{ getError('empId') }}
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">이름 <span class="required">*</span></label>
          <input type="text" formControlName="empNm" class="form-input"
            [class.error]="empNm?.invalid && empNm?.touched"
            placeholder="이름" />
          <div class="error-message" *ngIf="empNm?.invalid && empNm?.touched">
            {{ getError('empNm') }}
          </div>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">이메일 <span class="required">*</span></label>
        <input type="email" formControlName="empEmail" class="form-input"
          [class.error]="empEmail?.invalid && empEmail?.touched"
          placeholder="이메일 주소" />
        <div class="error-message" *ngIf="empEmail?.invalid && empEmail?.touched">
          {{ getError('empEmail') }}
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">비밀번호 <span class="required">*</span></label>
          <input type="password" formControlName="empPw" class="form-input"
            [class.error]="empPw?.invalid && empPw?.touched"
            placeholder="6자 이상" />
          <div class="error-message" *ngIf="empPw?.invalid && empPw?.touched">
            {{ getError('empPw') }}
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">비밀번호 확인 <span class="required">*</span></label>
          <input type="password" formControlName="empPwConfirm" class="form-input"
            [class.error]="(empPwConfirm?.touched && registerForm.errors?.['passwordMismatch'])">
          <div class="error-message"
            *ngIf="empPwConfirm?.touched && registerForm.errors?.['passwordMismatch']">
            비밀번호가 일치하지 않습니다.
          </div>
        </div>
      </div>

      <div class="success-message" *ngIf="successMessage()">{{ successMessage() }}</div>
      <div class="error-message global-error" *ngIf="errorMessage()">{{ errorMessage() }}</div>

      <button type="submit" class="register-button"
        [disabled]="isLoading()" [class.loading]="isLoading()">
        <span *ngIf="!isLoading()">가입하기</span>
        <span *ngIf="isLoading()">처리 중...</span>
      </button>

      <div class="login-link-section">
        이미 계정이 있으신가요?
        <a routerLink="/login" class="login-link">로그인</a>
      </div>
    </form>
  </div>
</div>
